# StructuresPlus - config
# Traite uniquement les nouveaux chunks (structures fraichement generees).
# Mets true pour aussi traiter les chunks deja existants (une seule fois par chunk).
process-existing-chunks: false
disabled-worlds: []

# Vieillissement : briques moussues/fissurees, cobblestone moussue, tapis de mousse
weathering:
  enabled: true
  chance: 0.08
  moss-carpet-chance: 0.03
  structures: [stronghold, jungle, ruin, portal, shipwreck, ancient_city, trail_ruins, mansion]

# Details de village : lanternes sur les barrieres, fleurs sur l'herbe
village-decor:
  enabled: true
  lantern-chance: 0.08
  flower-chance: 0.04

# Toiles d'araignee dans les coins des structures sombres
cobwebs:
  enabled: true
  chance: 0.12
  structures: [stronghold, jungle, desert, ancient_city, trail_ruins, mansion, mineshaft]

# Ressources en plus dans TOUS les coffres de structures (tables chests/*)
bonus-loot:
  enabled: true
  chance: 0.7          # chance d'avoir du bonus dans un coffre
  rolls-low: 2         # max de stacks bonus (structures simples)
  rolls-high: 4        # max de stacks bonus (structures riches)
  high-keywords: [ancient_city, stronghold, bastion, end_city, trial, mansion, buried_treasure, jungle, desert_pyramid, ruined_portal, shipwreck]

# Remplit les coffres/tonneaux vides sans table de loot qui sont dans une structure
fill-empty-containers:
  enabled: true
  chance: 0.5

# Format : MATERIAL:min-max:poids
pools:
  low:
    - "BREAD:2-6:5"
    - "COAL:3-8:5"
    - "IRON_INGOT:1-4:4"
    - "GOLD_INGOT:1-3:3"
    - "ARROW:4-12:3"
    - "COOKED_BEEF:2-5:3"
    - "EMERALD:1-3:2"
    - "LAPIS_LAZULI:2-6:2"
    - "REDSTONE:3-8:2"
  high:
    - "IRON_INGOT:4-10:4"
    - "GOLD_INGOT:3-8:4"
    - "EMERALD:2-6:4"
    - "EXPERIENCE_BOTTLE:2-6:4"
    - "GOLDEN_APPLE:1-2:3"
    - "ENDER_PEARL:1-3:2"
    - "OBSIDIAN:2-6:2"
    - "DIAMOND:1-3:2"
    - "NETHERITE_SCRAP:1-2:1"
